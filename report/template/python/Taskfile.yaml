---
version: '3'

silent: true

tasks:
  dependencies:
    desc: Install dependencies.
    internal: true
    cmds:
      - poetry install

  publish:
    desc: Publish PyPi package in Espresso-PyPi repo (https://engci-maven-master.cisco.com/artifactory/api/pypi/espresso-pypi/)
    cmds:
      - poetry publish --build --repository devhubcloud --verbose
