[project]
name = "agntcy-a2a-csit-python-fixture"
version = "0.1.0"
description = "Python interop fixture for A2A CSIT"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[grpc,http-server]>=1.0.0",
    "cryptography>=48.0.1",
    "idna==3.15",
    "requests>=2.34.2",
    "starlette>=1.3.1",
    "uvicorn>=0.35.0",
]

[tool.uv]
# Security floors for transitive dependencies (Dependabot alerts):
#   pyasn1     <= 0.6.3  vulnerable; pulled in via a2a-sdk.       Force >= 0.6.4.
#   setuptools <  83.0.0 vulnerable; pulled in via grpcio-tools. Force >= 83.0.0.
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "setuptools>=83.0.0",
]
