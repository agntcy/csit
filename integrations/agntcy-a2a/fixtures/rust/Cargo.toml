[package]
name = "agntcy-a2a-csit-fixtures"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
a2a = { package = "agntcy-a2a", version = "0.2.2" }
a2a-server = { package = "agntcy-a2a-server", version = "0.1.2" }
axum = "0.8"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }