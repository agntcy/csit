---
version: '3'

silent: true

tasks:
  test:
    desc: All A2A interoperability tests
    cmds:
      - task: test:rust-go:jsonrpc

  test:rust-go:jsonrpc:
    desc: Rust and Go JSON-RPC interoperability smoke test
    cmds:
      - mkdir -p ./reports
      - cd tests && go test . -v -failfast -test.v -test.paniconexit0 -ginkgo.timeout 20m -timeout 20m -ginkgo.v --ginkgo.json-report=../reports/report-agntcy-a2a.json --ginkgo.junit-report=../reports/report-agntcy-a2a.xml

  default:
    cmd: task -l