# Routes the dir daemon's version-scoped validation calls
#   POST {schema_url}/api/{schema_version}/validate/object/record
# to the matching single-version oasf-server backend, stripping the version
# segment (each backend serves its own schema under /api/...). This mirrors the
# hosted schema.oasf.outshift.com composite so a single schema_url validates
# records across all OASF versions the client suite pushes (0.7.0 / 0.8.0 / 1.0.0).
server {
    listen 8080;
    resolver 127.0.0.11 valid=30s;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/api/0\.7\.0/(.*)$ {
        proxy_pass http://oasf-070:8080/api/$1$is_args$args;
    }
    location ~ ^/api/0\.8\.0/(.*)$ {
        proxy_pass http://oasf-080:8080/api/$1$is_args$args;
    }
    location ~ ^/api/1\.0\.0/(.*)$ {
        proxy_pass http://oasf-100:8080/api/$1$is_args$args;
    }
    location ~ ^/api/1\.1\.0/(.*)$ {
        proxy_pass http://oasf-110:8080/api/$1$is_args$args;
    }

    location / {
        return 404;
    }
}
