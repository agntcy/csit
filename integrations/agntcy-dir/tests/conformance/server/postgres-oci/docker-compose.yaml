name: dir-config-postgres-oci

include:
  - ../_oasf/compose.yaml

services:
  postgres:
    image: "docker.io/bitnami/postgresql:latest@sha256:c30c796dcf96a67a405b905bf6aaf8d6c957d5c2fe729db6e67e2760e21fd9f8"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: directory
    ports:
      - 25432:5432
    healthcheck:
      test: pg_isready -U postgres -d directory || exit 1
      interval: 5s
      retries: 30
      start_period: 5s
    deploy:
      restart_policy:
        condition: on-failure

  daemon:
    image: "ghcr.io/agntcy/dir-ctl:v1.6.1"
    ports:
      - 8888:8888 # API server
      - 8890:8890 # OCI registry (embedded)
      - 9090:9090 # DHT
    command:
      - daemon
      - start
      - --config=/config/dir-daemon-config.yaml
      - --data-dir=/tmp
    volumes:
      - "./dir-daemon-config.yaml:/config/dir-daemon-config.yaml:ro"
    healthcheck:
      test: ["CMD", "./dirctl", "--server-addr=127.0.0.1:8888", "routing", "info"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      oasf-server:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
