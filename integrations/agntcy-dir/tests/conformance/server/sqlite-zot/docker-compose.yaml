name: dir-config-sqlite-zot

include:
  - ../_oasf/compose.yaml

services:
  zot:
    # NOTE: the zot image is distroless (no shell, no wget/curl), so an in-container
    # HTTP healthcheck cannot run. Readiness is instead gated by the daemon's own
    # healthcheck (which only passes once the registry is reachable), so the daemon
    # depends on zot with condition: service_started.
    image: "ghcr.io/project-zot/zot:v2.1.17"
    ports:
      - 8890:5000 # OCI registry (external Zot)
    deploy:
      restart_policy:
        condition: on-failure

  daemon:
    image: "ghcr.io/agntcy/dir-ctl:v1.6.1"
    ports:
      - 8888:8888 # API server
      - 9090:9090 # DHT
    command:
      - daemon
      - start
      - --config=/config/dir-daemon-config.yaml
      - --data-dir=/tmp
    volumes:
      - "./dir-daemon-config.yaml:/config/dir-daemon-config.yaml:ro"
    healthcheck:
      test: ["CMD", "./dirctl", "--server-addr=127.0.0.1:8888", "routing", "info"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    depends_on:
      zot:
        condition: service_started
      oasf-server:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
