version: "3"

vars:
  # Cross-version conformance: run the pinned client suite against multiple released server images.
  CONFORMANCE_SERVER_VERSIONS: ["v1.3.0", "v1.2.0"]
  CONFORMANCE_CLIENT_VERSIONS: ["v1.3.0"]
  # Configuration matrix: run one client version against many DEPLOYMENT CONFIGURATIONS of dir.
  # Each entry is a folder under ./server/<name>/ that stands up a differently-configured daemon
  # (storage backend, OCI store mode, signing, authN, ...). See ./server/<name>/README or the
  # plan for what each profile exercises.
  CONFORMANCE_SERVER_CONFIGS: ["v1.6.1", "sqlite-zot", "postgres-oci", "postgres-zot", "x509-spire"]
  CONFORMANCE_CONFIG_CLIENT_VERSION: "v1.6.1"
  CONFORMANCE_CLIENT_TEST_PKG: 'github.com/agntcy/dir/tests/e2e/client'

includes:
  server:v1.2.0:
    taskfile: "./server/v1.2.0/Taskfile.yml"
  server:v1.3.0:
    taskfile: "./server/v1.3.0/Taskfile.yml"
  server:v1.3.0-spire:
    taskfile: "./server/v1.3.0-spire/Taskfile.yml"
  # Configuration-matrix profiles (base version v1.6.1)
  server:v1.6.1:
    taskfile: "./server/v1.6.1/Taskfile.yml"
  server:sqlite-zot:
    taskfile: "./server/sqlite-zot/Taskfile.yml"
  server:postgres-oci:
    taskfile: "./server/postgres-oci/Taskfile.yml"
  server:postgres-zot:
    taskfile: "./server/postgres-zot/Taskfile.yml"
  server:x509-spire:
    taskfile: "./server/x509-spire/Taskfile.yml"

tasks:
  up:
    vars:
      SERVER_VERSION: '{{.SERVER_VERSION}}'
      # e.g. if CLIENT_ENV=v1.3.0-spire then CLIENT_VERSION=v1.3.0
      CLIENT_VERSION: '{{ splitList "-" .CLIENT_VERSION | first }}'
      CLIENT_VERSION_FULL: '{{.CLIENT_VERSION}}'
      TMP_PATH: '{{ .TMP_PATH | default "/tmp/tests/client-server" }}'
      PATCH_FILE: '{{.TASKFILE_DIR}}/patches/e2e-shared-utils-common.go'
    cmds:
      # Prepare suite
      - |
        mkdir -p {{.TMP_PATH}}
        cd {{.TMP_PATH}}

        echo -e "module testing\ngo 1.26.5\n" > go.mod
        go mod tidy
        go get -t {{.CONFORMANCE_CLIENT_TEST_PKG}}@{{.CLIENT_VERSION}}

        # Apply a source overlay only for profiles that ship a `needs-overlay` marker.
        # (Older profiles patch the tests module's common.go; newer versions support SPIFFE
        # natively via client-config and must NOT be overlaid.)
        if [ -f "{{.TASKFILE_DIR}}/server/{{.SERVER_VERSION}}/needs-overlay" ]; then
          OVERLAY="{{.TMP_PATH}}/dir-tests-overlay"
          TESTS_MOD="$(go env GOMODCACHE)/github.com/agntcy/dir/tests@{{.CLIENT_VERSION}}"
          rm -rf "$OVERLAY"
          mkdir -p "$OVERLAY"
          cp -R "$TESTS_MOD/." "$OVERLAY/"
          chmod -R u+w "$OVERLAY"
          cp "{{.PATCH_FILE}}" "$OVERLAY/e2e/shared/utils/common.go"
          go mod edit -require=github.com/agntcy/dir/tests@{{.CLIENT_VERSION}}
          go mod edit -replace github.com/agntcy/dir/tests="$OVERLAY"
          go get -t {{.CONFORMANCE_CLIENT_TEST_PKG}}@{{.CLIENT_VERSION}}
        fi

      # Start dependencies
      - task: server:{{.SERVER_VERSION}}:up

  down:
    vars:
      SERVER_VERSION: '{{.SERVER_VERSION}}'
      CLIENT_VERSION: '{{.CLIENT_VERSION}}'
      TMP_PATH: '{{ .TMP_PATH | default "/tmp/tests/client-server" }}'
    cmds:
      # Stop dependencies
      - task: server:{{.SERVER_VERSION}}:down

      # Clean up suite
      - rm -rf {{.TMP_PATH}}

  test:
    vars:
      SERVER_VERSION: '{{.SERVER_VERSION | default "v1.3.0" }}'
      CLIENT_VERSION: '{{.CLIENT_VERSION | default "v1.3.0" }}'

      # Prefer a profile-local client config (co-located with the server profile) so signing/authN
      # profiles can ship their client-side knobs; otherwise fall back to the version-keyed config.
      CLIENT_CONFIG:
        sh: |
          if [ -f "{{.TASKFILE_DIR}}/server/{{.SERVER_VERSION}}/client-config.yaml" ]; then
            echo "{{.TASKFILE_DIR}}/server/{{.SERVER_VERSION}}/client-config.yaml"
          else
            echo "{{.TASKFILE_DIR}}/client/{{.CLIENT_VERSION}}/test-config.yaml"
          fi
      REPORTS_PATH: '{{.TASKFILE_DIR}}/reports'

      REPORTS_NAME: 'Server-{{.SERVER_VERSION}}-Client-{{.CLIENT_VERSION}}'
      TMP_PATH: '/tmp/tests/{{.REPORTS_NAME}}'
    cmds:
      # Setup env
      - defer:
          task: down
          vars:
            SERVER_VERSION: '{{.SERVER_VERSION}}'
            CLIENT_VERSION: '{{.CLIENT_VERSION}}'
            TMP_PATH: '{{.TMP_PATH}}'
      - task: up
        vars:
          SERVER_VERSION: '{{.SERVER_VERSION}}'
          CLIENT_VERSION: '{{.CLIENT_VERSION}}'
          TMP_PATH: '{{.TMP_PATH}}'

      # Run test package
      - |
        echo "Testing {{.REPORTS_NAME}}..."
        mkdir -p {{.REPORTS_PATH}}
        cd {{.TMP_PATH}}

        # If there's an .env file, use it
        ENV_FILE="{{ .TASKFILE_DIR }}/server/{{ .SERVER_VERSION }}/.env"
        if [ -f "$ENV_FILE" ]; then
          echo "Using $ENV_FILE"
          . "$ENV_FILE"
        fi

        # Legacy overlaid profiles read the SPIFFE socket from the environment; native-SPIFFE
        # profiles (v1.6.1+) pass it via client-config instead, so only export it for overlays.
        if [ -f "{{.TASKFILE_DIR}}/server/{{.SERVER_VERSION}}/needs-overlay" ]; then
          export SPIFFE_SOCKET_PATH="${SPIFFE_SOCKET_PATH:-unix:///tmp/spire-agent-host/public/api.sock}"
        fi

        go test {{.CONFORMANCE_CLIENT_TEST_PKG}} \
          -v -test.v -test.paniconexit0 -timeout 45m \
          -ginkgo.timeout 45m -ginkgo.v \
          -ginkgo.json-report={{.REPORTS_PATH}}/{{.REPORTS_NAME}}.json \
          -ginkgo.junit-report={{.REPORTS_PATH}}/{{.REPORTS_NAME}}.xml \
          -test-config {{.CLIENT_CONFIG}}

  test:all:
    vars:
      REPORTS_PATH: '{{.ROOT_DIR}}/integrations/agntcy-dir/tests/conformance/reports'
      SUMMARY_HTML: '{{.ROOT_DIR}}/summary.html'

    cmds:
      # Cross-version cells: pinned client suite against released server images.
      - for:
          matrix:
            SERVER_VERSION: { ref: '.CONFORMANCE_SERVER_VERSIONS' }
            CLIENT_VERSION: { ref: '.CONFORMANCE_CLIENT_VERSIONS' }
        task: test
        ignore_error: true
        vars:
          SERVER_VERSION: '{{.ITEM.SERVER_VERSION}}'
          CLIENT_VERSION: '{{.ITEM.CLIENT_VERSION}}'
          REPORTS_PATH: '{{.REPORTS_PATH}}'

      # Configuration-matrix cells: one client version against many deployment configurations.
      - for:
          matrix:
            SERVER_VERSION: { ref: '.CONFORMANCE_SERVER_CONFIGS' }
        task: test
        ignore_error: true
        vars:
          SERVER_VERSION: '{{.ITEM.SERVER_VERSION}}'
          CLIENT_VERSION: '{{.CONFORMANCE_CONFIG_CLIENT_VERSION}}'
          REPORTS_PATH: '{{.REPORTS_PATH}}'

      - |
        go run {{.ROOT_DIR}}/integrations/agntcy-a2a/tools/report_dashboard.go \
          --reports-dir {{.REPORTS_PATH}} \
          --output {{.SUMMARY_HTML}} \
          --title "DIR Conformance"

  # Emit every matrix cell as a JSON array of {server, client} objects — the single source of
  # truth for the CI job matrix (cross-version cells + configuration cells). Consumed by
  # `.github/workflows/test-directory-conformance.yaml`.
  matrix:list:
    silent: true
    vars:
      CONFIGS: '{{ .CONFORMANCE_SERVER_CONFIGS | join " " }}'
      SERVERS: '{{ .CONFORMANCE_SERVER_VERSIONS | join " " }}'
      CLIENTS: '{{ .CONFORMANCE_CLIENT_VERSIONS | join " " }}'
    cmd: |
      items=""
      add() { items="${items:+$items,}{\"server\":\"$1\",\"client\":\"$2\"}"; }
      # Cross-version cells (released server images x pinned client).
      for s in {{.SERVERS}}; do for c in {{.CLIENTS}}; do add "$s" "$c"; done; done
      # Configuration cells (deployment configurations x config client version).
      for s in {{.CONFIGS}}; do add "$s" "{{.CONFORMANCE_CONFIG_CLIENT_VERSION}}"; done
      printf '[%s]\n' "$items"

  # Build the dashboard from whatever reports already exist under ./reports (no test run).
  # Used by the CI "collect" job after per-cell report artifacts have been merged in.
  report:
    vars:
      REPORTS_PATH: '{{.REPORTS_PATH | default (printf "%s/reports" .TASKFILE_DIR)}}'
      SUMMARY_HTML: '{{.SUMMARY_HTML | default (printf "%s/summary.html" .ROOT_DIR)}}'
      TITLE: '{{.TITLE | default "DIR Conformance"}}'
    cmd: |
      go run {{.ROOT_DIR}}/integrations/agntcy-a2a/tools/report_dashboard.go \
        --reports-dir {{.REPORTS_PATH}} \
        --output {{.SUMMARY_HTML}} \
        --title "{{.TITLE}}"

  # Run ONLY the configuration matrix (deployment configurations of dir), then build the dashboard.
  # Useful for local iteration and for a CI job that owns just the config profiles.
  configs:all:
    vars:
      REPORTS_PATH: '{{.ROOT_DIR}}/integrations/agntcy-dir/tests/conformance/reports'
      SUMMARY_HTML: '{{.ROOT_DIR}}/summary.html'
    cmds:
      - for:
          matrix:
            SERVER_VERSION: { ref: '.CONFORMANCE_SERVER_CONFIGS' }
        task: test
        ignore_error: true
        vars:
          SERVER_VERSION: '{{.ITEM.SERVER_VERSION}}'
          CLIENT_VERSION: '{{.CONFORMANCE_CONFIG_CLIENT_VERSION}}'
          REPORTS_PATH: '{{.REPORTS_PATH}}'

      - |
        go run {{.ROOT_DIR}}/integrations/agntcy-a2a/tools/report_dashboard.go \
          --reports-dir {{.REPORTS_PATH}} \
          --output {{.SUMMARY_HTML}} \
          --title "DIR Configuration Matrix"
