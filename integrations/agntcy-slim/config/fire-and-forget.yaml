topology:
    clients:
        "alice":
            auth:
                spireJwt: true
            connectedTo:
                - "slim-1"
            image: agntcy/slim-bindings-examples:v0.0.1
            cmd: /app/bin/ff
            args: ["-m","hello","-i","1000","-l", "org/default/alice", "-r", "org/default/bob"]
        "bob":
            auth:
                spireJwt: true
            connectedTo:
                - "slim-2"
            image: agntcy/slim-bindings-examples:v0.0.1
            cmd: /app/bin/ff
            args: ["-i","1000", "-l", "org/default/bob"]
    servers:
        "slim-0":
            spireMtls: false
            routes:                
                - "bob > slim-2"  
                - "alice > slim-1"              
        "slim-1":
            routes:                                
                - "bob > slim-0"
        "slim-2":
            routes:                
                - "alice > slim-0"                
