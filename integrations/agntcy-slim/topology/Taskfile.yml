---
version: "3"

silent: true

vars:
  KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME | default "agntcy-test" }}'

  ## Image config
  IMAGE_REPO: '{{ .IMAGE_REPO | default "ghcr.io/agntcy" }}'

  SLIM_CHART_TAG: '{{ .SLIM_CHART_TAG | default "v1.5.0" }}'
  SLIM_IMAGE_TAG: '{{ .SLIM_IMAGE_TAG | default "2.0.0-alpha.2" }}'

  SLIM_CONTROLLER_CHART_TAG: '{{ .SLIM_CONTROLLER_CHART_TAG | default "v1.5.0" }}'
  SLIM_CONTROLLER_IMAGE_TAG: '{{ .SLIM_CONTROLLER_IMAGE_TAG | default "2.0.0-alpha.2" }}'

  SLIM_CONTROLLER_ENDPOINT: '{{ .SLIM_CONTROLLER_ENDPOINT | default "https://slim-control.admin.svc.cluster.local:50052" }}'

  HELM_NAMESPACE: '{{ .HELM_NAMESPACE | default "default" }}'

  SPIRE_NAMESPACE: '{{ .SPIRE_NAMESPACE | default "spire" }}'

  TOPOLOGY_CONFIG: '{{ .TOPOLOGY_CONFIG | default "config/clusters.yaml" }}'

  # Absolute path to agntcy/slim repo root (contains charts/). Empty = use OCI charts + SLIM_CHART_TAG.
  SLIM_REPO_PATH: '{{ .SLIM_REPO_PATH | default "" }}'

  # slimctl binary used by the test to drive the control-plane topology.
  SLIMCTL: '{{ .SLIMCTL | default "./bin/slimctl" }}'
  # Release tag must match the control-plane API (segment/link add commands).
  SLIMCTL_TAG: '{{ .SLIMCTL_TAG | default "slimctl-v2.0.0-alpha.2" }}'

  # p2p client image (built from examples/Dockerfile, provides slim-bindings-p2p).
  CLIENT_IMAGE: '{{ .CLIENT_IMAGE | default "ghcr.io/agntcy/slim/bindings-examples:local" }}'

  # slim-bindings version baked into the client image (empty = use examples/Dockerfile default).
  SLIM_BINDINGS_VERSION: '{{ .SLIM_BINDINGS_VERSION | default "" }}'

tasks:
  # LoadBalancer support for KinD — https://github.com/kubernetes-sigs/cloud-provider-kind
  # Required so the slim-control Service (type: LoadBalancer) gets an external IP
  # that slimctl can reach from the host. Requires Go.
  kind:cloud-provider-kind:up:
    desc: Start cloud-provider-kind (macOS sudo -v may prompt); wait until controller process is running
    cmds:
      - ./scripts/run-cloud-provider-kind.sh

  kind:cloud-provider-kind:down:
    desc: Stop any running cloud-provider-kind controller
    cmds:
      - sudo pkill -f 'cloud-provider-kind|provider-kind' 2>/dev/null || true

  test:topology:build:client-image:
    desc: Build the slim-bindings p2p client image and load it into the kind cluster
    cmds:
      - |
        set -eu
        BUILD_ARGS=""
        if [ -n '{{ .SLIM_BINDINGS_VERSION }}' ]; then
          BUILD_ARGS="--build-arg SLIM_BINDINGS_VERSION={{ .SLIM_BINDINGS_VERSION }}"
        fi
        docker build $BUILD_ARGS -t {{ .CLIENT_IMAGE }} ./examples
      - kind load docker-image {{ .CLIENT_IMAGE }} --name {{ .KIND_CLUSTER_NAME }}

  deps:slimctl-download:
    desc: Download slimctl used to drive the control-plane topology
    cmds:
      - |
        set -e
        SLIMCTL_ARCH=$(arch)
        SLIMCTL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        SLIMCTL_ABI=""
        if [ "$SLIMCTL_ARCH" = "x86_64" ]; then
          SLIMCTL_ARCH="amd64"
        fi
        if [ "$SLIMCTL_ARCH" = "aarch64" ]; then
          SLIMCTL_ARCH="arm64"
        fi
        if [ "$SLIMCTL_OS" = "linux" ]; then
          if ldd --version 2>&1 | grep -qi musl; then
            SLIMCTL_ABI="-musl"
          else
            SLIMCTL_ABI="-gnu"
          fi
        fi
        SLIMCTL_URL="https://github.com/agntcy/slim/releases/download/{{ .SLIMCTL_TAG }}/slimctl-$SLIMCTL_OS-$SLIMCTL_ARCH${SLIMCTL_ABI}.tar.gz"
        TARGET_DIR=$(dirname {{ .SLIMCTL }})
        mkdir -p "$TARGET_DIR"
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT
        echo "Downloading slimctl from $SLIMCTL_URL"
        curl --fail --show-error --location -o "$TMP_DIR/slimctl.tar.gz" "$SLIMCTL_URL"
        tar -xzf "$TMP_DIR/slimctl.tar.gz" -C "$TMP_DIR"
        mv "$TMP_DIR/slimctl" {{ .SLIMCTL }}
        chmod +x {{ .SLIMCTL }}
        {{ .SLIMCTL }} version || true

  test:topology:generate:cluster-configs:
    desc: Generates test environment configuration(s) for agntcy slim based on the provided test-setup descriptor
    cmd: |
      TOPOLOGY_CONFIG={{.TOPOLOGY_CONFIG}} SLIM_CONTROLLER_ENDPOINT={{ .SLIM_CONTROLLER_ENDPOINT }} go run ./tests/config/main/

  test:topology:deploy:controller:
    desc: Deploy slim controller
    cmds:
      - |
        set -euo pipefail
        REPO='{{ .SLIM_REPO_PATH }}'
        if [ -n "$REPO" ]; then
          if [ ! -d "$REPO/charts/slim-control-plane" ]; then
            echo "SLIM_REPO_PATH is set but charts/slim-control-plane not found under: $REPO" >&2
            exit 1
          fi
          helm upgrade slim-controller \
            "$REPO/charts/slim-control-plane" \
            --set image.tag="{{ .SLIM_CONTROLLER_IMAGE_TAG }}" \
            -f ./config/controller-values.yaml \
            --namespace "admin" \
            --create-namespace \
            --install \
            --wait \
            --wait-for-jobs \
            --timeout "15m"
        else
          helm upgrade slim-controller \
            oci://{{ .IMAGE_REPO }}/slim/helm/slim-control-plane \
            --version {{ .SLIM_CONTROLLER_CHART_TAG }} \
            --set image.tag="{{ .SLIM_CONTROLLER_IMAGE_TAG }}" \
            -f ./config/controller-values.yaml \
            --namespace "admin" \
            --create-namespace \
            --install \
            --wait \
            --wait-for-jobs \
            --timeout "15m"
        fi

  test:topology:cleanup:controller:
    desc: Remove slim controller test env
    cmds:
      - helm delete --namespace "admin" slim-controller

  test:topology:deploy:clusters:
    desc: Deploy agntcy slim test env for each values file in config/.gen
    deps:
      - test:topology:generate:cluster-configs
    cmd: |
      #!/bin/sh
      REPO='{{ .SLIM_REPO_PATH }}'
      if [ -n "$REPO" ] && [ ! -d "$REPO/charts/slim" ]; then
        echo "SLIM_REPO_PATH is set but charts/slim not found under: $REPO" >&2
        exit 1
      fi

      for file in "./config/.gen"/*.yaml ;do
        if [ -n "$REPO" ]; then
          helm upgrade agntcy-$(basename "$file" .yaml) \
            "$REPO/charts/slim" \
            --set slim.image.tag="{{ .SLIM_IMAGE_TAG }}" \
            -f "$file" \
            --namespace $(basename "$file" .yaml) \
            --create-namespace \
            --install \
            --wait \
            --wait-for-jobs \
            --timeout "15m"
        else
          helm upgrade agntcy-$(basename "$file" .yaml) \
            oci://{{ .IMAGE_REPO }}/slim/helm/slim \
            --version {{ .SLIM_CHART_TAG }} \
            --set slim.image.tag="{{ .SLIM_IMAGE_TAG }}" \
            -f "$file" \
            --namespace $(basename "$file" .yaml) \
            --create-namespace \
            --install \
            --wait \
            --wait-for-jobs \
            --timeout "15m"
        fi
      echo "Deployed agntcy-slim-$(basename "$file" .yaml) with config $(basename "$file")"
      done

  test:topology:cleanup:clusters:
    desc: Undeploy agntcy slim test env for each values file in config/.gen
    cmd: |
      #!/bin/sh
      for file in "./config/.gen"/*.yaml ;do
        helm delete --namespace $(basename "$file" .yaml) agntcy-$(basename "$file" .yaml)
        echo "Deleted agntcy-slim-$(basename "$file" .yaml) with config $(basename "$file")"
      done

  spire:deploy:
    desc: Deploy SPIRE server
    cmds:
      - |
        helm upgrade --install  \
        spire-crds \
        spire-crds \
        --repo https://spiffe.github.io/helm-charts-hardened/ \
        --namespace {{ .SPIRE_NAMESPACE }} \
        --create-namespace \
        --wait \
        --wait-for-jobs \
        --timeout "15m"
      - |
        helm upgrade --install  \
        spire \
        spire \
        --repo https://spiffe.github.io/helm-charts-hardened/ \
        --namespace {{ .SPIRE_NAMESPACE }} \
        --create-namespace \
        --wait \
        --wait-for-jobs \
        --timeout "15m"

  spire:remove:
    desc: Remove SPIRE server
    cmds:
      - helm delete spire -n {{ .SPIRE_NAMESPACE }}
      - helm delete spire-crds -n {{ .SPIRE_NAMESPACE }}

  test:topology:setup:
    desc: One-shot setup (everything except test:topology:run) — slimctl, client image, LoadBalancer provider, controller and clusters
    cmds:
      - task: deps:slimctl-download
      - task: test:topology:build:client-image
      - task: kind:cloud-provider-kind:up
      - task: test:topology:deploy:controller
      - task: test:topology:deploy:clusters

  test:topology:run:
    desc: Slim topology test
    cmds:
      - mkdir -p ./reports
      - |
        set -euo pipefail
        # The test runs with cwd = ./tests, so resolve slimctl to an absolute path.
        SLIMCTL_BIN="{{ .SLIMCTL }}"
        case "$SLIMCTL_BIN" in
          /*) : ;;
          *) SLIMCTL_BIN="$(pwd)/${SLIMCTL_BIN#./}" ;;
        esac
        NAMESPACE={{.HELM_NAMESPACE}} TOPOLOGY_CONFIG=../{{.TOPOLOGY_CONFIG}} SLIMCTL="$SLIMCTL_BIN" CLIENT_IMAGE="{{ .CLIENT_IMAGE }}" \
          go test ./tests -v -failfast -test.v -test.paniconexit0 -ginkgo.timeout 30m -timeout 30m -ginkgo.v -ginkgo.focus "Slim topology test" --ginkgo.json-report=../reports/report-slim-topology.json --ginkgo.junit-report=../reports/report-slim-topology.xml

  test:topology:report:
    desc: Render HTML dashboard from topology test Ginkgo JSON report
    preconditions:
      - sh: test -f ./reports/report-slim-topology.json
        msg: run test:topology:run first (missing reports/report-slim-topology.json)
    cmds:
      - mkdir -p ./reports
      - ./scripts/render-report.sh ./reports ./reports/index.html "Slim Topology Test Report"

  default:
    cmd: task -l
