# Values for the SLIM control plane used by the topology test.
# The control plane runs in API mode: it is the source of truth for the
# topology, but links/segments are created at runtime with slimctl instead of
# being baked into these values.

replicaCount: 1

image:
  repository: "ghcr.io/agntcy/slim/control-plane"
  pullPolicy: IfNotPresent
  tag: ""

fullnameOverride: "slim-control"

config:
  northbound:
    endpoint: "0.0.0.0:{{ .Values.service.north.port }}"
    tls:
      insecure: true

  southbound:
    endpoint: "0.0.0.0:{{ .Values.service.south.port }}"
    tls:
      insecure: true

  # SQLite persistence so the managed topology survives control-plane restarts.
  database:
    type: sqlite
    path: /db/controlplane.db

  tracing:
    log_level: debug

  # API mode: no pre-wired links. The test drives segments/links via slimctl.
  topology: {}

spire:
  enabled: false

service:
  # ClusterIP: the northbound (50051) API is reached from the host running the
  # test via `kubectl port-forward` (see the topology Taskfile), and the
  # southbound (50052) API is reached in-cluster via the service DNS name.
  type: ClusterIP
  south:
    port: 50052
  north:
    port: 50051

# Persist the SQLite database across pod restarts.
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
