apiVersion: bench.agntcy.io/v2
kind: ConsensusScenario
metadata:
    name: hypothesis-convergence-3agents
    domain: hypothesis-convergence
    description: "Baseline at small scale with no payload. Measures the floor cost of each transport when fan-out is trivial."
    order: 1
spec:
    agents: 3
    thinkTimeMs: 20
    findingEmitDelayMs: 1
    maxRounds: 200
    targetMode: majority
    seed: 42
    valueSpace: 3
    epochs: 5
    maxEpochTimeMs: 5000
agents:
    - id: agent-0
      slimName: agntcy/bench-v2/agent-0
      p2pPort: 9700
      role: coordinator
    - id: agent-1
      slimName: agntcy/bench-v2/agent-1
      p2pPort: 9711
      role: worker
    - id: agent-2
      slimName: agntcy/bench-v2/agent-2
      p2pPort: 9722
      role: worker
