apiVersion: bench.agntcy.io/v2
kind: ConsensusScenario
metadata:
    name: hypothesis-convergence-20agents-10240b-lat100
    domain: hypothesis-convergence
    description: "Distant-region case with a large (10 KB) payload: one third of the 20 agents carry an added network delay, as if hosted in a remote region. Measures the combined effect of remote-region latency and payload size on each transport's fan-out."
    order: 8
spec:
    agents: 20
    thinkTimeMs: 20
    findingEmitDelayMs: 1
    maxRounds: 200
    targetMode: majority
    seed: 42
    valueSpace: 3
    payloadBytes: 10240
    epochs: 5
    maxEpochTimeMs: 5000
agents:
