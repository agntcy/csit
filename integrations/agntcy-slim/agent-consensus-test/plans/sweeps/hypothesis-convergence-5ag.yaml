apiVersion: bench.agntcy.io/v2
kind: ConsensusScenario
metadata:
    name: hypothesis-convergence-5agents
    domain: hypothesis-convergence
    description: "Small scale, no payload, slightly more agents. Measures whether a few extra peers change the relay cost."
    order: 2
spec:
    agents: 5
    thinkTimeMs: 20
    findingEmitDelayMs: 1
    maxRounds: 200
    targetMode: majority
    seed: 42
    valueSpace: 3
    epochs: 5
    maxEpochTimeMs: 5000
agents:
    - id: agent-0
      slimName: agntcy/bench-v2/agent-0
      p2pPort: 9700
      role: coordinator
    - id: agent-1
      slimName: agntcy/bench-v2/agent-1
      p2pPort: 9711
      role: worker
    - id: agent-2
      slimName: agntcy/bench-v2/agent-2
      p2pPort: 9722
      role: worker
    - id: agent-3
      slimName: agntcy/bench-v2/agent-3
      p2pPort: 9733
      role: worker
    - id: agent-4
      slimName: agntcy/bench-v2/agent-4
      p2pPort: 9744
      role: worker
