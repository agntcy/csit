---
version: '3'

silent: true

vars:
  SCENARIO_DIR: '{{ .SCENARIO_DIR | default "./plans/sweeps" }}'
  REPORTS_DIR: '{{ .REPORTS_DIR | default "./reports" }}'
  RESULTS_TSV: '{{ .RESULTS_TSV | default "./reports/results.tsv" }}'
  SWEEP_TSV: '{{ .SWEEP_TSV | default "./reports/sweep.tsv" }}'
  MATRIX_DIR: '{{ .MATRIX_DIR | default "./plans/matrix" }}'
  MATRIX_TSV: '{{ .MATRIX_TSV | default "./reports/matrix.tsv" }}'
  BIN_DIR: '{{ .BIN_DIR | default "./bin" }}'
  SLIM_ENDPOINT: '{{ .SLIM_ENDPOINT | default "http://127.0.0.1:46357" }}'
  COMPARE_SLIMCTL: '{{ .COMPARE_SLIMCTL | default "./bin/slimctl" }}'
  COMPARE_SLIM_BINDINGS_VERSION: '{{ .COMPARE_SLIM_BINDINGS_VERSION | default "v1.4.0" }}'
  COMPARE_SLIMCTL_TAG: '{{ .COMPARE_SLIMCTL_TAG | default "slimctl-v1.4.0" }}'

tasks:
  default:
    cmd: task -l

  deps:slim-bindings-setup:
    desc: Install native SLIM bindings required by slim agents
    cmds:
      - go run github.com/agntcy/slim-bindings-go/cmd/slim-bindings-setup@{{ .COMPARE_SLIM_BINDINGS_VERSION }}

  deps:slimctl-download:
    desc: Download slimctl for local SLIM stack startup
    cmds:
      - |
        set -e
        SLIMCTL_ARCH=$(arch)
        SLIMCTL_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        SLIMCTL_ABI=""
        if [ "$SLIMCTL_ARCH" = "x86_64" ]; then
          SLIMCTL_ARCH="amd64"
        fi
        if [ "$SLIMCTL_OS" = "linux" ]; then
          if ldd --version 2>&1 | grep -qi musl; then
            SLIMCTL_ABI="-musl"
          else
            SLIMCTL_ABI="-gnu"
          fi
        fi
        SLIMCTL_URL="https://github.com/agntcy/slim/releases/download/{{ .COMPARE_SLIMCTL_TAG }}/slimctl-$SLIMCTL_OS-$SLIMCTL_ARCH${SLIMCTL_ABI}.tar.gz"
        TARGET_DIR=$(dirname {{ .COMPARE_SLIMCTL }})
        mkdir -p "$TARGET_DIR"
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT
        curl --fail --show-error --location -o "$TMP_DIR/slimctl.tar.gz" "$SLIMCTL_URL"
        tar -xzf "$TMP_DIR/slimctl.tar.gz" -C "$TMP_DIR"
        mv "$TMP_DIR/slimctl" {{ .COMPARE_SLIMCTL }}
        chmod +x {{ .COMPARE_SLIMCTL }}
        {{ .COMPARE_SLIMCTL }} version || true

  build:
    desc: Build p2p and slim agent/runner binaries
    deps:
      - deps:slim-bindings-setup
    cmds:
      - mkdir -p {{ .BIN_DIR }}
      - go build -o {{ .BIN_DIR }}/p2p-agent ./p2p/cmd/agent
      - go build -o {{ .BIN_DIR }}/p2p-runner ./p2p/cmd/runner
      - |
        CACHE_DIR="$(go env GOPATH)/.cgo-cache/slim-bindings/{{ .COMPARE_SLIM_BINDINGS_VERSION }}"
        export CGO_LDFLAGS="-L${CACHE_DIR}"
        go build -o {{ .BIN_DIR }}/slim-agent ./slim/cmd/agent
        go build -o {{ .BIN_DIR }}/slim-runner ./slim/cmd/runner

  validate:scenarios:
    desc: Validate consensus scenario YAML files
    cmds:
      - go run ./tools/validate_scenarios --dir {{ .SCENARIO_DIR }}

  compare:cleanup:
    internal: true
    cmds:
      - pkill -f '{{ .BIN_DIR }}/p2p-agent' 2>/dev/null || true
      - pkill -f '{{ .BIN_DIR }}/slim-agent' 2>/dev/null || true
      - pkill -f 'slimctl slim start -c' 2>/dev/null || true

  compare:suite:
    desc: Run default consensus scenarios on P2P and SLIM
    deps:
      - build
      - validate:scenarios
    cmds:
      - task: compare:cleanup
      - rm -f {{ .RESULTS_TSV }}
      - |
        set -euo pipefail
        # Run plans in the order declared by each plan's metadata.order (plans
        # without an order sink to the end), so results are produced 3ag, 5ag, 10ag, ...
        ordered=$(for scenario in {{ .SCENARIO_DIR }}/hypothesis-convergence-*.yaml; do
          [ -f "$scenario" ] || continue
          ord=$(awk '/^[[:space:]]*order:/ {print $2; exit}' "$scenario")
          [ -n "$ord" ] || ord=9999
          printf '%s\t%s\n' "$ord" "$scenario"
        done | sort -n | cut -f2-)
        for scenario in $ordered; do
          [ -f "$scenario" ] || continue
          base=$(basename "$scenario" .yaml)
          echo "==> P2P $base"
          {{ .BIN_DIR }}/p2p-runner \
            --scenario "$scenario" \
            --agent-bin {{ .BIN_DIR }}/p2p-agent \
            --quiet \
            --output-json {{ .REPORTS_DIR }}/p2p-${base}.json \
            --output-tsv {{ .RESULTS_TSV }} || true
        done
      - task: compare:slim-stack
        vars:
          SCENARIO_GLOB: '{{ .SCENARIO_DIR }}/hypothesis-convergence-*.yaml'

  compare:plan:
    desc: Run one scenario on P2P and SLIM (PLAN=path or basename)
    deps:
      - build
    requires:
      vars: [PLAN]
    cmds:
      - task: compare:cleanup
      - rm -f {{ .RESULTS_TSV }}
      - |
        set -euo pipefail
        PLAN_INPUT="{{ .PLAN }}"
        if [ -f "$PLAN_INPUT" ]; then
          SCENARIO_PATH="$PLAN_INPUT"
        elif [ -f "{{ .SCENARIO_DIR }}/${PLAN_INPUT}.yaml" ]; then
          SCENARIO_PATH="{{ .SCENARIO_DIR }}/${PLAN_INPUT}.yaml"
        else
          echo "scenario not found: ${PLAN_INPUT}" >&2
          exit 1
        fi
        base=$(basename "$SCENARIO_PATH" .yaml)
        echo "==> P2P ${base}"
        {{ .BIN_DIR }}/p2p-runner \
          --scenario "$SCENARIO_PATH" \
          --agent-bin {{ .BIN_DIR }}/p2p-agent \
          --quiet \
          --output-json {{ .REPORTS_DIR }}/p2p-${base}.json \
          --output-tsv {{ .RESULTS_TSV }}
      - task: compare:slim-stack
        vars:
          SCENARIO_GLOB: '{{ .PLAN }}'

  compare:slim-stack:
    internal: true
    deps:
      - deps:slimctl-download
    cmds:
      - |
        set -euo pipefail
        SCENARIO_INPUT="{{ .SCENARIO_GLOB }}"
        resolve_scenario() {
          local input="$1"
          if [ -f "$input" ]; then
            printf '%s' "$input"
            return
          fi
          if [ -f "{{ .SCENARIO_DIR }}/${input}.yaml" ]; then
            printf '%s' "{{ .SCENARIO_DIR }}/${input}.yaml"
            return
          fi
          printf '%s' "$input"
        }
        DATAPLANE_PORT=46357
        CONTROLLER_PORT=46358
        CONFIG=$(mktemp)
        trap 'kill ${SLIM_PID:-} 2>/dev/null || true; rm -f "$CONFIG"; {{ .COMPARE_SLIMCTL }} slim stop 2>/dev/null || true' EXIT
        cat > "$CONFIG" <<EOF
        services:
          slim/0:
            node_id: "slim-bench-v2"
            group_name: "bench-v2"
            dataplane:
              servers:
                - endpoint: "127.0.0.1:${DATAPLANE_PORT}"
                  metadata:
                    local_endpoint: "127.0.0.1"
                    external_endpoint: "127.0.0.1:${DATAPLANE_PORT}"
                    trust_domain: "example.org"
                  tls:
                    insecure: true
            controller:
              servers:
                - endpoint: "127.0.0.1:${CONTROLLER_PORT}"
                  tls:
                    insecure: true
        EOF
        {{ .COMPARE_SLIMCTL }} slim start -c "$CONFIG" >>{{ .REPORTS_DIR }}/slimctl.log 2>&1 &
        SLIM_PID=$!
        for i in $(seq 1 50); do
          if nc -z 127.0.0.1 "${DATAPLANE_PORT}" 2>/dev/null; then
            break
          fi
          sleep 0.2
        done
        if [[ "$SCENARIO_INPUT" == *"*"* ]]; then
          # Expand the glob and order by each plan's metadata.order so SLIM runs
          # in the same 3ag, 5ag, 10ag, ... sequence as the P2P leg.
          SCENARIO_LIST=()
          while IFS= read -r scenario; do
            [ -n "$scenario" ] && SCENARIO_LIST+=("$scenario")
          done < <(for f in $SCENARIO_INPUT; do
            [ -f "$f" ] || continue
            ord=$(awk '/^[[:space:]]*order:/ {print $2; exit}' "$f")
            [ -n "$ord" ] || ord=9999
            printf '%s\t%s\n' "$ord" "$f"
          done | sort -n | cut -f2-)
        else
          SCENARIO_LIST=("$(resolve_scenario "$SCENARIO_INPUT")")
        fi
        for scenario in "${SCENARIO_LIST[@]}"; do
          [ -f "$scenario" ] || continue
          base=$(basename "$scenario" .yaml)
          echo "==> SLIM ${base}"
          {{ .BIN_DIR }}/slim-runner \
            --scenario "$scenario" \
            --endpoint {{ .SLIM_ENDPOINT }} \
            --agent-bin {{ .BIN_DIR }}/slim-agent \
            --quiet \
            --output-json {{ .REPORTS_DIR }}/slim-${base}.json \
            --output-tsv {{ .RESULTS_TSV }} || true
        done

  compare:report:
    desc: Build HTML dashboard from comparison TSV results
    cmds:
      - go run ./tools/report --tsv {{ .RESULTS_TSV }} --sweep-tsv {{ .SWEEP_TSV }} --matrix-tsv {{ .MATRIX_TSV }} --scenario-dir {{ .SCENARIO_DIR }} --output {{ .REPORTS_DIR }}/index.html

  compare:matrix:report:
    desc: Build HTML dashboard from aggregated matrix stats TSV (same output as compare:sweep:matrix:merge report step)
    cmds:
      - go run ./tools/report --matrix-only --matrix-tsv {{ .MATRIX_STATS_TSV | default "./reports/matrix-stats.tsv" }} --matrix-dir {{ .MATRIX_DIR }} --output {{ .REPORTS_DIR }}/matrix.html
      - cp {{ .REPORTS_DIR }}/matrix.html {{ .REPORTS_DIR }}/index.html

  compare:sweep:matrix:cell:
    desc: Run one matrix cell with repeated Ginkgo benchmarks (MATRIX_LATENCY_MS, MATRIX_AGENTS, MATRIX_PAYLOAD_BYTES, CONSENSUS_REPEATS)
    deps:
      - build
    vars:
      MATRIX_LATENCY_MS: '{{ .MATRIX_LATENCY_MS | default "0" }}'
      MATRIX_AGENTS: '{{ .MATRIX_AGENTS | default "3" }}'
      MATRIX_PAYLOAD_BYTES: '{{ .MATRIX_PAYLOAD_BYTES | default "0" }}'
      MATRIX_THINK_MS: '{{ .MATRIX_THINK_MS | default "20" }}'
      MATRIX_EPOCHS: '{{ .MATRIX_EPOCHS | default "5" }}'
      MATRIX_MAX_EPOCH_MS: '{{ .MATRIX_MAX_EPOCH_MS | default "120000" }}'
      CONSENSUS_REPEATS: '{{ .CONSENSUS_REPEATS | default "1" }}'
    env:
      CONSENSUS_RUN_MATRIX: "1"
      BIN_DIR: "{{ .BIN_DIR }}"
      REPORTS_DIR: "{{ .REPORTS_DIR }}"
      MATRIX_DIR: "{{ .MATRIX_DIR }}"
      COMPARE_SLIMCTL: "{{ .COMPARE_SLIMCTL }}"
      SLIM_ENDPOINT: "{{ .SLIM_ENDPOINT }}"
      MATRIX_LATENCY_MS: "{{ .MATRIX_LATENCY_MS }}"
      MATRIX_AGENTS: "{{ .MATRIX_AGENTS }}"
      MATRIX_PAYLOAD_BYTES: "{{ .MATRIX_PAYLOAD_BYTES }}"
      MATRIX_THINK_MS: "{{ .MATRIX_THINK_MS }}"
      MATRIX_EPOCHS: "{{ .MATRIX_EPOCHS }}"
      MATRIX_MAX_EPOCH_MS: "{{ .MATRIX_MAX_EPOCH_MS }}"
      CONSENSUS_REPEATS: "{{ .CONSENSUS_REPEATS }}"
    cmds:
      - go test ./tests -count=1 -v -failfast -timeout 360m --ginkgo.label-filter=matrix-cell --ginkgo.timeout=360m

  compare:sweep:matrix:
    desc: Run full agents×payload×latency matrix locally (sequential cells via Ginkgo)
    deps:
      - build
    vars:
      MATRIX_LATENCY_MS: '{{ .MATRIX_LATENCY_MS | default "0,25,50,100" }}'
      MATRIX_AGENTS: '{{ .MATRIX_AGENTS | default "3,5,10,20,30" }}'
      MATRIX_PAYLOAD_BYTES: '{{ .MATRIX_PAYLOAD_BYTES | default "0,1024,4096,10240" }}'
      CONSENSUS_REPEATS: '{{ .CONSENSUS_REPEATS | default "1" }}'
    cmds:
      - task: compare:cleanup
      - rm -rf {{ .REPORTS_DIR }}/raw
      - |
        set -euo pipefail
        IFS=',' read -r -a LATENCY_LIST <<< "{{ .MATRIX_LATENCY_MS }}"
        IFS=',' read -r -a AGENT_LIST <<< "{{ .MATRIX_AGENTS }}"
        IFS=',' read -r -a PAYLOAD_LIST <<< "{{ .MATRIX_PAYLOAD_BYTES }}"
        for lat in "${LATENCY_LIST[@]}"; do
          for agents in "${AGENT_LIST[@]}"; do
            for payload in "${PAYLOAD_LIST[@]}"; do
              task compare:sweep:matrix:cell \
                MATRIX_LATENCY_MS="$lat" \
                MATRIX_AGENTS="$agents" \
                MATRIX_PAYLOAD_BYTES="$payload" \
                CONSENSUS_REPEATS="{{ .CONSENSUS_REPEATS }}"
            done
          done
        done
      - task: compare:sweep:matrix:merge

  compare:sweep:matrix:slice:
    desc: Deprecated alias for one matrix cell (use compare:sweep:matrix:cell)
    cmds:
      - task: compare:sweep:matrix:cell
        vars:
          MATRIX_LATENCY_MS: '{{ .MATRIX_LATENCY_MS | default "0" }}'
          MATRIX_AGENTS: '{{ .MATRIX_AGENTS | default "3,5,10,20,30" }}'
          MATRIX_PAYLOAD_BYTES: '{{ .MATRIX_PAYLOAD_BYTES | default "0,1024,4096,10240" }}'
          CONSENSUS_REPEATS: '{{ .CONSENSUS_REPEATS | default "1" }}'

  compare:sweep:matrix:merge:
    desc: Merge per-cell raw TSV slices, aggregate statistics, and render dashboard
    vars:
      MATRIX_RAW_DIR: '{{ .MATRIX_RAW_DIR | default "./reports/raw" }}'
      MATRIX_RAW_TSV: '{{ .MATRIX_RAW_TSV | default "./reports/matrix-raw.tsv" }}'
      MATRIX_STATS_TSV: '{{ .MATRIX_STATS_TSV | default "./reports/matrix-stats.tsv" }}'
    cmds:
      - |
        set -eu
        mkdir -p {{ .REPORTS_DIR }} {{ .MATRIX_RAW_DIR }}
        rm -f {{ .MATRIX_RAW_TSV }}
        first=true
        for f in {{ .MATRIX_RAW_DIR }}/matrix-lat*.tsv; do
          if [ ! -f "$f" ]; then
            continue
          fi
          if [ "$first" = true ]; then
            cat "$f" > {{ .MATRIX_RAW_TSV }}
            first=false
          else
            tail -n +2 "$f" >> {{ .MATRIX_RAW_TSV }}
          fi
        done
        if [ ! -s {{ .MATRIX_RAW_TSV }} ]; then
          echo "no matrix data to merge" >&2
          exit 1
        fi
      - go run ./tools/aggregate_matrix -in {{ .MATRIX_RAW_TSV }} -out {{ .MATRIX_STATS_TSV }}
      - go run ./tools/report --matrix-only --matrix-tsv {{ .MATRIX_STATS_TSV }} --matrix-dir {{ .MATRIX_DIR }} --output {{ .REPORTS_DIR }}/matrix.html
      - cp {{ .REPORTS_DIR }}/matrix.html {{ .REPORTS_DIR }}/index.html

  compare:sweep:matrix:dummy:
    desc: Smoke-test matrix merge + report with dummy TSV slices (no benchmark runs)
    cmds:
      - go run ./tools/gen_dummy_matrix_tsv -out-dir {{ .REPORTS_DIR }}/raw -repeats 3
      - task: compare:sweep:matrix:merge

  compare:sweep:
    desc: Run agent/think-time/payload sweep (SWEEP_AGENTS, SWEEP_THINK_MS, SWEEP_PAYLOAD_BYTES env lists)
    deps:
      - build
    vars:
      SWEEP_FAMILY: '{{ .SWEEP_FAMILY | default "hypothesis-convergence" }}'
      SWEEP_AGENTS: '{{ .SWEEP_AGENTS | default "2,5,10,17" }}'
      SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS | default "10,20,50" }}'
      SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES | default "0" }}'
      SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS | default "10" }}'
      SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS | default "30000" }}'
    cmds:
      - task: compare:cleanup
      - rm -f {{ .SWEEP_TSV }}
      - task: compare:sweep:run
        vars:
          SWEEP_FAMILY: '{{ .SWEEP_FAMILY }}'
          SWEEP_AGENTS: '{{ .SWEEP_AGENTS }}'
          SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS }}'
          SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES }}'
          SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS }}'
          SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS }}'

  compare:sweep:payload:
    desc: High-N / short-window / large-payload sweep highlighting SLIM multicast (10kB default)
    deps:
      - build
    vars:
      SWEEP_FAMILY: '{{ .SWEEP_FAMILY | default "hypothesis-convergence" }}'
      SWEEP_AGENTS: '{{ .SWEEP_AGENTS | default "10,50" }}'
      SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS | default "5" }}'
      SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES | default "0,10240" }}'
      SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS | default "10" }}'
      SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS | default "30000" }}'
    cmds:
      - task: compare:cleanup
      - rm -f {{ .SWEEP_TSV }}
      - task: compare:sweep:run
        vars:
          SWEEP_FAMILY: '{{ .SWEEP_FAMILY }}'
          SWEEP_AGENTS: '{{ .SWEEP_AGENTS }}'
          SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS }}'
          SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES }}'
          SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS }}'
          SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS }}'
      - task: compare:report

  compare:sweep:run:
    internal: true
    vars:
      SWEEP_FAMILY: '{{ .SWEEP_FAMILY | default "hypothesis-convergence" }}'
      SWEEP_AGENTS: '{{ .SWEEP_AGENTS | default "2,5,10,17" }}'
      SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS | default "10,20,50" }}'
      SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES | default "0" }}'
      SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS | default "10" }}'
      SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS | default "30000" }}'
    cmds:
      - |
        set -euo pipefail
        mkdir -p {{ .REPORTS_DIR }} {{ .SCENARIO_DIR }}
        IFS=',' read -r -a AGENT_LIST <<< "{{ .SWEEP_AGENTS }}"
        IFS=',' read -r -a THINK_LIST <<< "{{ .SWEEP_THINK_MS }}"
        IFS=',' read -r -a PAYLOAD_LIST <<< "{{ .SWEEP_PAYLOAD_BYTES }}"
        for agents in "${AGENT_LIST[@]}"; do
          for think in "${THINK_LIST[@]}"; do
            for payload in "${PAYLOAD_LIST[@]}"; do
              suffix=""
              if [ "$payload" != "0" ]; then suffix="-${payload}b"; fi
              scenario_path="{{ .SCENARIO_DIR }}/{{ .SWEEP_FAMILY }}-${agents}ag-${think}ms${suffix}.yaml"
              go run ./tools/gen_scenario \
                -family {{ .SWEEP_FAMILY }} \
                -agents "$agents" \
                -think-ms "$think" \
                -payload-bytes "$payload" \
                -epochs {{ .SWEEP_EPOCHS }} \
                -max-epoch-ms {{ .SWEEP_MAX_EPOCH_MS }} \
                -output "$scenario_path"
              base=$(basename "$scenario_path" .yaml)
              echo "==> sweep P2P $base"
              {{ .BIN_DIR }}/p2p-runner \
                --scenario "$scenario_path" \
                --agent-bin {{ .BIN_DIR }}/p2p-agent \
                --quiet \
                --output-json {{ .REPORTS_DIR }}/p2p-${base}.json \
                --output-tsv {{ .SWEEP_TSV }} || true
            done
          done
        done
      - task: compare:sweep:slim
        vars:
          SWEEP_FAMILY: '{{ .SWEEP_FAMILY }}'
          SWEEP_AGENTS: '{{ .SWEEP_AGENTS }}'
          SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS }}'
          SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES }}'
          SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS }}'
          SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS }}'

  compare:sweep:slim:
    internal: true
    deps:
      - deps:slimctl-download
    vars:
      SWEEP_FAMILY: '{{ .SWEEP_FAMILY | default "hypothesis-convergence" }}'
      SWEEP_AGENTS: '{{ .SWEEP_AGENTS | default "2,5,10,17" }}'
      SWEEP_THINK_MS: '{{ .SWEEP_THINK_MS | default "10,20,50" }}'
      SWEEP_PAYLOAD_BYTES: '{{ .SWEEP_PAYLOAD_BYTES | default "0" }}'
      SWEEP_EPOCHS: '{{ .SWEEP_EPOCHS | default "10" }}'
      SWEEP_MAX_EPOCH_MS: '{{ .SWEEP_MAX_EPOCH_MS | default "30000" }}'
    cmds:
      - |
        set -euo pipefail
        IFS=',' read -r -a AGENT_LIST <<< "{{ .SWEEP_AGENTS }}"
        IFS=',' read -r -a THINK_LIST <<< "{{ .SWEEP_THINK_MS }}"
        IFS=',' read -r -a PAYLOAD_LIST <<< "{{ .SWEEP_PAYLOAD_BYTES }}"
        DATAPLANE_PORT=46357
        CONTROLLER_PORT=46358
        CONFIG=$(mktemp)
        trap 'kill ${SLIM_PID:-} 2>/dev/null || true; rm -f "$CONFIG"; {{ .COMPARE_SLIMCTL }} slim stop 2>/dev/null || true' EXIT
        cat > "$CONFIG" <<EOF
        services:
          slim/0:
            node_id: "slim-bench-v2"
            group_name: "bench-v2"
            dataplane:
              servers:
                - endpoint: "127.0.0.1:${DATAPLANE_PORT}"
                  metadata:
                    local_endpoint: "127.0.0.1"
                    external_endpoint: "127.0.0.1:${DATAPLANE_PORT}"
                    trust_domain: "example.org"
                  tls:
                    insecure: true
            controller:
              servers:
                - endpoint: "127.0.0.1:${CONTROLLER_PORT}"
                  tls:
                    insecure: true
        EOF
        {{ .COMPARE_SLIMCTL }} slim start -c "$CONFIG" >>{{ .REPORTS_DIR }}/slimctl.log 2>&1 &
        SLIM_PID=$!
        for i in $(seq 1 50); do
          if nc -z 127.0.0.1 "${DATAPLANE_PORT}" 2>/dev/null; then
            break
          fi
          sleep 0.2
        done
        for agents in "${AGENT_LIST[@]}"; do
          for think in "${THINK_LIST[@]}"; do
            for payload in "${PAYLOAD_LIST[@]}"; do
              suffix=""
              if [ "$payload" != "0" ]; then suffix="-${payload}b"; fi
              scenario_path="{{ .SCENARIO_DIR }}/{{ .SWEEP_FAMILY }}-${agents}ag-${think}ms${suffix}.yaml"
              [ -f "$scenario_path" ] || continue
              base=$(basename "$scenario_path" .yaml)
              echo "==> sweep SLIM $base"
              {{ .BIN_DIR }}/slim-runner \
                --scenario "$scenario_path" \
                --endpoint {{ .SLIM_ENDPOINT }} \
                --agent-bin {{ .BIN_DIR }}/slim-agent \
                --quiet \
                --output-json {{ .REPORTS_DIR }}/slim-${base}.json \
                --output-tsv {{ .SWEEP_TSV }} || true
            done
          done
        done

  compare:ci:smoke:
    desc: CI smoke — one sweep point plus report (~2 min)
    deps:
      - build
    cmds:
      - task: compare:cleanup
      - rm -f {{ .RESULTS_TSV }} {{ .SWEEP_TSV }}
      - |
        set -euo pipefail
        mkdir -p {{ .SCENARIO_DIR }} {{ .REPORTS_DIR }}
        scenario_path="{{ .SCENARIO_DIR }}/ci-smoke-hypothesis-5ag-20ms.yaml"
        go run ./tools/gen_scenario -family hypothesis-convergence -agents 5 -think-ms 20 -epochs 10 -max-epoch-ms 10000 -output "$scenario_path"
        echo "==> smoke P2P"
        {{ .BIN_DIR }}/p2p-runner \
          --scenario "$scenario_path" \
          --agent-bin {{ .BIN_DIR }}/p2p-agent \
          --quiet \
          --output-json {{ .REPORTS_DIR }}/p2p-ci-smoke.json \
          --output-tsv {{ .RESULTS_TSV }}
      - task: compare:slim-stack
        vars:
          SCENARIO_GLOB: 'plans/sweeps/ci-smoke-hypothesis-5ag-20ms.yaml'
      - task: compare:report

  test:
    desc: Run unit tests
    cmds:
      - go test ./... -count=1
