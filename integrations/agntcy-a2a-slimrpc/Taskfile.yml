---
version: '3'

silent: true

# Single source of truth for the pinned, released SLIM baseline used both locally
# (git checkout slim-v{{.SLIM_RELEASE}} + cargo run) and in CI (the same image).
# Keep these aligned with:
#   - slimBindingsSetupModule / slimBindingsCacheTag / CGO tier in tests/launchers_test.go
#   - slim-bindings-go in fixtures/go/go.mod
#   - slima2a / slim-bindings pins in fixtures/python/requirements.txt
#   - the slim service in .github/workflows/test-integrations.yaml
vars:
  # Released slim node. There is no slim-v1.4.1 node tag; 1.4.0 is the closest node
  # release to the slim-bindings 1.4.x family and shares its dataplane wire.
  SLIM_RELEASE: '1.4.0'
  SLIM_IMAGE: 'ghcr.io/agntcy/slim:{{.SLIM_RELEASE}}'
  # slim-bindings release tag (slim-bindings-setup tag + CGO cache tier; PyPI slim-bindings 1.4.x).
  SLIM_BINDINGS_RELEASE: 'v1.4.1'
  # Node baseline: the published @agntcy/slim-a2a pins slim-bindings 2.0-alpha, a distinct
  # (wire-incompatible) dataplane generation from the 1.4 baseline above. node↔node runs against
  # this 2.0 node; node↔{go,python,dotnet,java} self-skip inside the suite (wire skew) until the
  # other SDKs bump to 2.0. Pin alpha.3 to match the bindings the SDK was built against exactly.
  SLIM_NODE_RELEASE: '2.0.0-alpha.3'
  SLIM_NODE_IMAGE: 'ghcr.io/agntcy/slim:{{.SLIM_NODE_RELEASE}}'

tasks:
  test:
    desc: A2A over SLIMRPC interop (full Go+Python+.NET+Java+Node 5×5) — requires a running SLIM node
    # Runs each client→server pair as its own report (report-agntcy-a2a-slimrpc-<client>-<server>),
    # mirroring the agntcy-a2a per-pair layout so the dashboard shows one "Saved Run" per pair.
    # ignore_error lets the remaining pairs run (and the dashboard capture them) if one fails.
    cmds:
      - task: test:go-go
        ignore_error: true
      - task: test:go-python
        ignore_error: true
      - task: test:go-dotnet
        ignore_error: true
      - task: test:python-go
        ignore_error: true
      - task: test:python-python
        ignore_error: true
      - task: test:python-dotnet
        ignore_error: true
      - task: test:dotnet-go
        ignore_error: true
      - task: test:dotnet-python
        ignore_error: true
      - task: test:dotnet-dotnet
        ignore_error: true
      - task: test:go-java
        ignore_error: true
      - task: test:python-java
        ignore_error: true
      - task: test:dotnet-java
        ignore_error: true
      - task: test:java-go
        ignore_error: true
      - task: test:java-python
        ignore_error: true
      - task: test:java-dotnet
        ignore_error: true
      - task: test:java-java
        ignore_error: true
      - task: test:node-node
        ignore_error: true
      - task: test:go-node
        ignore_error: true
      - task: test:python-node
        ignore_error: true
      - task: test:dotnet-node
        ignore_error: true
      - task: test:java-node
        ignore_error: true
      - task: test:node-go
        ignore_error: true
      - task: test:node-python
        ignore_error: true
      - task: test:node-dotnet
        ignore_error: true
      - task: test:node-java
        ignore_error: true

  test:go-go:
    desc: SLIMRPC interop — Go client → Go server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-go-go'
          REPORT_NAME: report-agntcy-a2a-slimrpc-go-go

  test:go-python:
    desc: SLIMRPC interop — Go client → Python server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-go-python'
          REPORT_NAME: report-agntcy-a2a-slimrpc-go-python

  test:python-go:
    desc: SLIMRPC interop — Python client → Go server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-python-go'
          REPORT_NAME: report-agntcy-a2a-slimrpc-python-go

  test:python-python:
    desc: SLIMRPC interop — Python client → Python server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-python-python'
          REPORT_NAME: report-agntcy-a2a-slimrpc-python-python

  test:go-dotnet:
    desc: SLIMRPC interop — Go client → .NET server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-go-dotnet'
          REPORT_NAME: report-agntcy-a2a-slimrpc-go-dotnet

  test:python-dotnet:
    desc: SLIMRPC interop — Python client → .NET server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-python-dotnet'
          REPORT_NAME: report-agntcy-a2a-slimrpc-python-dotnet

  test:dotnet-go:
    desc: SLIMRPC interop — .NET client → Go server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-dotnet-go'
          REPORT_NAME: report-agntcy-a2a-slimrpc-dotnet-go

  test:dotnet-python:
    desc: SLIMRPC interop — .NET client → Python server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-dotnet-python'
          REPORT_NAME: report-agntcy-a2a-slimrpc-dotnet-python

  test:go-java:
    desc: SLIMRPC interop — Go client → Java server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-go-java'
          REPORT_NAME: report-agntcy-a2a-slimrpc-go-java

  test:python-java:
    desc: SLIMRPC interop — Python client → Java server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-python-java'
          REPORT_NAME: report-agntcy-a2a-slimrpc-python-java

  test:dotnet-java:
    desc: SLIMRPC interop — .NET client → Java server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-dotnet-java'
          REPORT_NAME: report-agntcy-a2a-slimrpc-dotnet-java

  test:java-go:
    desc: SLIMRPC interop — Java client → Go server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-java-go'
          REPORT_NAME: report-agntcy-a2a-slimrpc-java-go

  test:java-python:
    desc: SLIMRPC interop — Java client → Python server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-java-python'
          REPORT_NAME: report-agntcy-a2a-slimrpc-java-python

  test:java-dotnet:
    desc: SLIMRPC interop — Java client → .NET server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-java-dotnet'
          REPORT_NAME: report-agntcy-a2a-slimrpc-java-dotnet

  test:java-java:
    desc: SLIMRPC interop — Java client → Java server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-java-java'
          REPORT_NAME: report-agntcy-a2a-slimrpc-java-java

  test:dotnet-dotnet:
    desc: SLIMRPC interop — .NET client → .NET server
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-dotnet-dotnet'
          REPORT_NAME: report-agntcy-a2a-slimrpc-dotnet-dotnet

  # ---- Node pairs -------------------------------------------------------------------
  # node speaks the slim 2.0 wire (published @agntcy/slim-a2a pins slim-bindings 2.0-alpha),
  # distinct from the 1.4 baseline. node-node runs for real against a slim 2.0 node
  # (SLIM_NODE_IMAGE); the 8 node↔{go,python,dotnet,java} cross pairs self-skip inside the
  # suite (wire skew) so the dashboard shows them as pending, not red.

  test:node-node:
    desc: >-
      SLIMRPC interop — Node client → Node server. Requires a running slim 2.0 node
      ({{.SLIM_NODE_IMAGE}}), NOT the 1.4 baseline. Locally this is a separate run against a
      hand-started 2.0 node (see README "Node and slim 2.0"); `task test` uses one SLIM_SERVER
      for the whole grid, so it cannot span both slim generations at once (like test:go-main).
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-node-node'
          REPORT_NAME: report-agntcy-a2a-slimrpc-node-node

  test:go-node:
    desc: SLIMRPC interop — Go client → Node server (self-skips — wire skew until Go moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-go-node'
          REPORT_NAME: report-agntcy-a2a-slimrpc-go-node

  test:python-node:
    desc: SLIMRPC interop — Python client → Node server (self-skips — wire skew until Python moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-python-node'
          REPORT_NAME: report-agntcy-a2a-slimrpc-python-node

  test:dotnet-node:
    desc: SLIMRPC interop — .NET client → Node server (self-skips — wire skew until .NET moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-dotnet-node'
          REPORT_NAME: report-agntcy-a2a-slimrpc-dotnet-node

  test:java-node:
    desc: SLIMRPC interop — Java client → Node server (self-skips — wire skew until Java moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-java-node'
          REPORT_NAME: report-agntcy-a2a-slimrpc-java-node

  test:node-go:
    desc: SLIMRPC interop — Node client → Go server (self-skips — wire skew until Go moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-node-go'
          REPORT_NAME: report-agntcy-a2a-slimrpc-node-go

  test:node-python:
    desc: SLIMRPC interop — Node client → Python server (self-skips — wire skew until Python moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-node-python'
          REPORT_NAME: report-agntcy-a2a-slimrpc-node-python

  test:node-dotnet:
    desc: SLIMRPC interop — Node client → .NET server (self-skips — wire skew until .NET moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-node-dotnet'
          REPORT_NAME: report-agntcy-a2a-slimrpc-node-dotnet

  test:node-java:
    desc: SLIMRPC interop — Node client → Java server (self-skips — wire skew until Java moves to slim 2.0)
    cmds:
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-node-java'
          REPORT_NAME: report-agntcy-a2a-slimrpc-node-java

  versions:
    desc: Print the pinned released SLIM baseline (node image + bindings) used locally and in CI
    cmds:
      - |
        echo "slim node image  : {{.SLIM_IMAGE}}"
        echo "slim release tag  : slim-v{{.SLIM_RELEASE}} (git checkout for a local 'cargo run --bin slim')"
        echo "slim-bindings     : {{.SLIM_BINDINGS_RELEASE}} (slim-bindings-setup tag + CGO tier; PyPI slim-bindings 1.4.x)"
        echo "slim node (node)  : {{.SLIM_NODE_IMAGE}} (2.0 wire for the Node fixture; node↔node only)"

  reports:dashboard:
    desc: Render HTML dashboard from reports (reuses agntcy-a2a tool)
    cmds:
      - mkdir -p ./reports
      - |
        go run ../agntcy-a2a/tools/report_dashboard.go \
          --reports-dir ./reports --output ./reports/index.html \
          --title "A2A over SLIMRPC Interop Dashboard"

  test:go-main:
    desc: >-
      Dev-only: go→go interop against a slim node built from `main` (2.0). Validates that the
      slim-main override env vars are set, then runs the suite. See README "Go native and slim main".
    preconditions:
      - sh: '[ "${CSIT_SLIM_GO_ONLY}" = "1" ]'
        msg: 'set CSIT_SLIM_GO_ONLY=1 (PyPI slima2a is incompatible with slim-bindings 2.x on main)'
      - sh: '[ -n "${CSIT_SLIM_BINDINGS_GO_REPLACE}" ]'
        msg: 'set CSIT_SLIM_BINDINGS_GO_REPLACE=/path/to/slim/data-plane/bindings/go/slim_bindings (run `task generate PROFILE=release` there first)'
      - sh: '[ -n "${CSIT_SLIM_NATIVE_LIB}" ]'
        msg: 'set CSIT_SLIM_NATIVE_LIB to the libslim_bindings_<triple>.a built from the same slim commit as your running node'
    cmds:
      - |
        echo "Running go→go SLIMRPC interop against slim 'main' with:"
        echo "  CSIT_SLIM_GO_ONLY=${CSIT_SLIM_GO_ONLY}"
        echo "  CSIT_SLIM_BINDINGS_GO_REPLACE=${CSIT_SLIM_BINDINGS_GO_REPLACE}"
        echo "  CSIT_SLIM_NATIVE_LIB=${CSIT_SLIM_NATIVE_LIB}"
        echo "  CSIT_SLIM_BINDINGS_CGO_VERSION=${CSIT_SLIM_BINDINGS_CGO_VERSION:-devel (default when REPLACE is set)}"
        echo "Tip: clear the build cache after a bindings change: rm -rf .cache"
      - task: test:interop:run
        vars:
          LABEL_FILTER: 'suite-slim-a2a && pair-go-go'
          REPORT_NAME: report-agntcy-a2a-slimrpc-go-go

  test:interop:run:
    internal: true
    cmds:
      - mkdir -p ./reports
      # Run from the tests package dir (cd tests; go test .) so Ginkgo resolves the
      # relative report paths against ./tests and writes into ./reports — mirroring
      # the agntcy-a2a target. Invoking `go test ./agntcy-a2a-slimrpc/tests` from
      # integrations would land the reports under tests/agntcy-a2a-slimrpc/reports.
      - |
        set +e
        (
          cd tests &&
          go test . -count=1 -v -failfast \
            -ginkgo.timeout 30m -timeout 30m -ginkgo.v \
            {{if .LABEL_FILTER}}-ginkgo.label-filter='{{.LABEL_FILTER}}'{{end}} \
            --ginkgo.json-report=../reports/{{.REPORT_NAME}}.json \
            --ginkgo.junit-report=../reports/{{.REPORT_NAME}}.xml
        )
        test_status=$?
        go run ../agntcy-a2a/tools/report_dashboard.go \
          --reports-dir ./reports --output ./reports/index.html \
          --title "A2A over SLIMRPC Interop Dashboard"
        dashboard_status=$?
        if [ "$test_status" -ne 0 ]; then
          exit "$test_status"
        fi
        exit "$dashboard_status"

  default:
    cmd: task -l
