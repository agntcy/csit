---
version: '3'

silent: true

includes:
  a2a:
    taskfile: ./agntcy-a2a/Taskfile.yml
    dir: ./agntcy-a2a
    excludes: [ default ]

  slim:
    taskfile: ./agntcy-slim/Taskfile.yml
    dir: ./agntcy-slim
    excludes: [ default ]
    vars:
      KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME }}'
      SLIM_IMAGE_TAG: '{{ .SLIM_IMAGE_TAG }}'
      SLIM_CHART_TAG: '{{ .SLIM_CHART_TAG }}'
      HELM_NAMESPACE: '{{ .HELM_NAMESPACE }}'

  directory:
    taskfile: ./agntcy-dir/Taskfile.yml
    dir: ./agntcy-dir
    excludes: [ default ]
    vars:
      KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME }}'
      DIRECTORY_IMAGE_TAG: '{{ .DIRECTORY_IMAGE_TAG }}'
      DIRECTORY_CHART_TAG: '{{ .DIRECTORY_CHART_TAG }}'
      HELM_NAMESPACE: '{{ .HELM_NAMESPACE }}'

  apps:
    taskfile: ./agntcy-apps/Taskfile.yml
    dir: ./agntcy-apps
    excludes: [ default ]
    vars:
      WFSM_BIN_VERSION: '{{ .WFSM_BIN_VERSION }}'

vars:
  KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME | default "agntcy-test" }}'

tasks:
  kind:create:
    desc: Create kind cluster
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER_NAME}} --wait 60s || true
      - kubectl cluster-info --context kind-{{.KIND_CLUSTER_NAME}}

  kind:destroy:
    desc: Destroy kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}

  version:
    desc: Get version
    cmds:
      - git describe --tags --match "v*" | cut -c 2-

  test:a2a:
    desc: All A2A interoperability tests
    cmds:
      - task: a2a:test

  test:a2a:rust-go:
    desc: Rust and Go interoperability test matrix across JSON-RPC, HTTP+JSON, and gRPC
    cmds:
      - task: a2a:test:rust-go

  test:a2a:rust-go:jsonrpc:
    desc: Rust and Go JSON-RPC interoperability matrix
    cmds:
      - task: a2a:test:rust-go:jsonrpc

  test:a2a:rust-go:rest:
    desc: Rust and Go HTTP+JSON interoperability matrix
    cmds:
      - task: a2a:test:rust-go:rest

  test:a2a:rust-go:grpc:
    desc: Rust and Go gRPC interoperability matrix
    cmds:
      - task: a2a:test:rust-go:grpc

  test:a2a:rust-go:jsonrpc:go-go:
    desc: Go client to Go server JSON-RPC interoperability test
    cmds:
      - task: a2a:test:rust-go:jsonrpc:go-go

  test:a2a:rust-go:jsonrpc:go-rust:
    desc: Go client to Rust server JSON-RPC interoperability test
    cmds:
      - task: a2a:test:rust-go:jsonrpc:go-rust

  test:a2a:rust-go:jsonrpc:rust-go:
    desc: Rust client to Go server JSON-RPC interoperability test
    cmds:
      - task: a2a:test:rust-go:jsonrpc:rust-go

  test:a2a:rust-go:jsonrpc:rust-rust:
    desc: Rust client to Rust server JSON-RPC interoperability test
    cmds:
      - task: a2a:test:rust-go:jsonrpc:rust-rust

  test:a2a:rust-go:rest:go-go:
    desc: Go client to Go server HTTP+JSON interoperability test
    cmds:
      - task: a2a:test:rust-go:rest:go-go

  test:a2a:rust-go:rest:go-rust:
    desc: Go client to Rust server HTTP+JSON interoperability test
    cmds:
      - task: a2a:test:rust-go:rest:go-rust

  test:a2a:rust-go:rest:rust-go:
    desc: Rust client to Go server HTTP+JSON interoperability test
    cmds:
      - task: a2a:test:rust-go:rest:rust-go

  test:a2a:rust-go:rest:rust-rust:
    desc: Rust client to Rust server HTTP+JSON interoperability test
    cmds:
      - task: a2a:test:rust-go:rest:rust-rust

  test:a2a:rust-go:grpc:go-go:
    desc: Go client to Go server gRPC interoperability test
    cmds:
      - task: a2a:test:rust-go:grpc:go-go

  test:a2a:rust-go:grpc:go-rust:
    desc: Go client to Rust server gRPC interoperability test
    cmds:
      - task: a2a:test:rust-go:grpc:go-rust

  test:a2a:rust-go:grpc:rust-go:
    desc: Rust client to Go server gRPC interoperability test
    cmds:
      - task: a2a:test:rust-go:grpc:rust-go

  test:a2a:rust-go:grpc:rust-rust:
    desc: Rust client to Rust server gRPC interoperability test
    cmds:
      - task: a2a:test:rust-go:grpc:rust-rust

  default:
    cmd: task -l