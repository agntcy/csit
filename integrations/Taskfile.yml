---
version: '3'

silent: true

includes:
  a2a:
    taskfile: ./agntcy-a2a/Taskfile.yml
    dir: ./agntcy-a2a
    excludes: [ default ]

  a2a-slimrpc:
    taskfile: ./agntcy-a2a-slimrpc/Taskfile.yml
    dir: ./agntcy-a2a-slimrpc
    excludes: [ default ]

  slim:
    taskfile: ./agntcy-slim/topology/Taskfile.yml
    dir: ./agntcy-slim/topology
    excludes: [ default ]
    vars:
      KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME }}'
      HELM_NAMESPACE: '{{ .HELM_NAMESPACE }}'
      SLIM_REPO_PATH: '{{ .SLIM_REPO_PATH | default "" }}'
      SLIM_BINDINGS_VERSION: '{{ .SLIM_BINDINGS_VERSION | default "" }}'

  slim-mcp:
    taskfile: ./agntcy-slim/mcp/Taskfile.yml
    dir: ./agntcy-slim/mcp
    excludes: [ default ]
    # NOTE: do not map SLIM_IMAGE_TAG / SLIM_CHART_TAG / MCP_PROXY_IMAGE_TAG /
    # SLIM_MCP_RUST_REF here. Those names collide with the topology (`slim`)
    # include's own defaults (e.g. SLIM_CHART_TAG=v1.5.0), which leak through a
    # `{{ .SLIM_CHART_TAG }}` mapping and override the mcp taskfile's own
    # defaults (v1.4.0). The mcp taskfile defines these vars with defaults, and
    # explicit CLI overrides (task ... SLIM_CHART_TAG=...) still propagate as
    # global variables, so no mapping is needed.

  slim-agent-consensus:
    taskfile: ./agntcy-slim/agent-consensus-test/Taskfile.yml
    dir: ./agntcy-slim/agent-consensus-test
    excludes: [ default ]

  directory:
    taskfile: ./agntcy-dir/Taskfile.yml
    dir: ./agntcy-dir
    excludes: [ default ]
    vars:
      KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME }}'
      DIRECTORY_IMAGE_TAG: '{{ .DIRECTORY_IMAGE_TAG }}'
      DIRECTORY_CHART_TAG: '{{ .DIRECTORY_CHART_TAG }}'
      HELM_NAMESPACE: '{{ .HELM_NAMESPACE }}'

vars:
  KIND_CLUSTER_NAME: '{{ .KIND_CLUSTER_NAME | default "agntcy-test" }}'

tasks:
  kind:create:
    desc: Create kind cluster
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER_NAME}} --wait 60s || true
      - kubectl cluster-info --context kind-{{.KIND_CLUSTER_NAME}}

  kind:destroy:
    desc: Destroy kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}

  version:
    desc: Get version
    cmds:
      - git describe --tags --match "v*" | cut -c 2-

  default:
    cmd: task -l