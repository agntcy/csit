# Listens on host 127.0.0.1:80 and forwards gRPC to the two KinD ingress port mappings.
services:
  edge:
    image: nginx:1.27-alpine
    container_name: kind-slim-multi-host-edge
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
