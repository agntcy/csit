# agntcy slim — KinD cluster B, namespace cluster-b
# Controller on cluster A via cluster-A ingress (nginx). Pods resolve control.cluster-a.csit.test
# to the ingress LoadBalancer IP (cloud-provider-kind); CoreDNS on B is patched by
# task optional:with-ingress:full / up:with-ingress-apps.
# Host browsers still use optional edge nginx + local DNS helper (*.csit.test → loopback).
# If pods cannot reach the LB VIP (some Docker Desktop setups), merge slim-cluster-b.docker-desktop.yaml.
slim:
  replicaCount: 1
  daemonset: false
  image:
    repository: ghcr.io/agntcy/slim
    pullPolicy: IfNotPresent
    tag: ""
  overrideConfig:
    tracing:
      log_level: debug
      display_thread_names: true
      display_thread_ids: true
    runtime:
      n_cores: 0
      thread_name: slim-data-plane
      drain_timeout: 10s
    services:
      slim/0:
        group_name: cluster-b
        dataplane:
          servers:
            - endpoint: "0.0.0.0:46357"
              metadata:
                local_endpoint: ${env:MY_POD_IP}
                external_endpoint: "agntcy-cluster-b-slim.cluster-b.svc.cluster.local:46357"
                trust_domain: example.org
              tls:
                insecure: true
        controller:
          clients:
            - endpoint: "http://control.cluster-a.csit.test"
              tls:
                insecure: true

  ingresses:
    - portName: data-plane-0
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
      hosts:
        - host: slim.cluster-b.csit.test
          paths:
            - path: /
              pathType: Prefix

mcpProxy:
  enabled: false
