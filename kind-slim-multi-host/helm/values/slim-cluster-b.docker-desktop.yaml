#
# Optional overlay for cluster B when slim pods must reach cluster A's ingress from inside
# KinD (Docker Desktop). Merge with slim-cluster-b.yaml, e.g.:
#   helm upgrade ... -f helm/values/slim-cluster-b.yaml -f helm/values/slim-cluster-b.docker-desktop.yaml
#
# Uses the host-published ingress port (see kind/cluster-a.yaml extraPortMappings → :10080).
# gRPC :authority may not match the Ingress host; if connections fail, use NodePort + CoreDNS
# instead or run tests from the host with control.cluster-a.csit.test:80 + local DNS helper.
slim:
  overrideConfig:
    services:
      slim/0:
        controller:
          clients:
            - endpoint: "host.docker.internal:10080"
              tls:
                insecure: true
