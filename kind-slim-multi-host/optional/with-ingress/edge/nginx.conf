# gRPC (HTTP/2) on 127.0.0.1:80 → KinD ingress-nginx backends by Host.
# A: host.docker.internal:10080  B: host.docker.internal:9080
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    http2 on;
    server_name .cluster-a.csit.test;
    location / {
      grpc_pass grpc://host.docker.internal:10080;
      grpc_set_header Host $host;
      grpc_set_header X-Real-IP $remote_addr;
      grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  server {
    listen 80;
    http2 on;
    server_name .cluster-b.csit.test;
    location / {
      grpc_pass grpc://host.docker.internal:9080;
      grpc_set_header Host $host;
      grpc_set_header X-Real-IP $remote_addr;
      grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
