# Example: KinD A with host port maps for use with optional/with-ingress/edge.
# Replace kind/cluster-a.yaml or merge when using the edge+dnsmasq stack.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: csit-a
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 10080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 10443
        listenAddress: "127.0.0.1"
        protocol: TCP
