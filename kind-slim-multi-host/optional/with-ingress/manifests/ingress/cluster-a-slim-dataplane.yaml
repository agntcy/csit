# kubectl --context kind-csit-a apply -f cluster-a-slim-dataplane.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agntcy-slim-dataplane-grpc
  namespace: cluster-a
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: slim.cluster-a.csit.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agntcy-cluster-a-slim
                port:
                  number: 46357
