#
# KinD cluster A (csit-a) with host port maps for ingress-nginx + optional edge proxy.
# CoreDNS peer setup still works; use `task up:with-ingress-apps` for the full Ingress stack.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: csit-a
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 10080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 10443
        listenAddress: "127.0.0.1"
        protocol: TCP
