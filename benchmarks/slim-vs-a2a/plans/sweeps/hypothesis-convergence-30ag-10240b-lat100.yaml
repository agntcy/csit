apiVersion: bench.agntcy.io/v2
kind: ConsensusScenario
metadata:
    name: hypothesis-convergence-30agents-10240b-lat100
    domain: hypothesis-convergence
    description: "Distant-region stress case: one third of the 30 agents carry an added network delay while every finding also carries a large (10 KB) payload. Measures each transport's behavior when high agent count, large payloads, and a remote-region subset compound."
    order: 9
spec:
    agents: 30
    thinkTimeMs: 20
    findingEmitDelayMs: 1
    maxRounds: 200
    targetMode: majority
    seed: 42
    valueSpace: 3
    payloadBytes: 10240
    epochs: 5
    maxEpochTimeMs: 5000
