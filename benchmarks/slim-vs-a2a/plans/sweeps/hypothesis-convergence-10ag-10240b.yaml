apiVersion: bench.agntcy.io/v2
kind: ConsensusScenario
metadata:
    name: hypothesis-convergence-10agents-10240b
    domain: hypothesis-convergence
    description: "Introduces a large (10 KB) payload at a moderate agent count. Isolates the effect of payload size alone on each transport."
    order: 3
spec:
    agents: 10
    thinkTimeMs: 20
    findingEmitDelayMs: 1
    maxRounds: 200
    targetMode: majority
    seed: 42
    valueSpace: 3
    payloadBytes: 10240
    epochs: 5
    maxEpochTimeMs: 5000
agents:
    - id: agent-0
      slimName: agntcy/bench-v2/agent-0
      a2aPort: 9700
      role: coordinator
    - id: agent-1
      slimName: agntcy/bench-v2/agent-1
      a2aPort: 9711
      role: worker
    - id: agent-2
      slimName: agntcy/bench-v2/agent-2
      a2aPort: 9722
      role: worker
    - id: agent-3
      slimName: agntcy/bench-v2/agent-3
      a2aPort: 9733
      role: worker
    - id: agent-4
      slimName: agntcy/bench-v2/agent-4
      a2aPort: 9744
      role: worker
    - id: agent-5
      slimName: agntcy/bench-v2/agent-5
      a2aPort: 9755
      role: worker
    - id: agent-6
      slimName: agntcy/bench-v2/agent-6
      a2aPort: 9766
      role: worker
    - id: agent-7
      slimName: agntcy/bench-v2/agent-7
      a2aPort: 9777
      role: worker
    - id: agent-8
      slimName: agntcy/bench-v2/agent-8
      a2aPort: 9788
      role: worker
    - id: agent-9
      slimName: agntcy/bench-v2/agent-9
      a2aPort: 9799
      role: worker
