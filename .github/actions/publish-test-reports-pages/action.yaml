# Landing page and suite reports under docs/ (docs/index.html, docs/a2a/, docs/directory/, …).

name: Publish test reports to GitHub Pages
description: Download suite artifacts, update gh-pages report dirs and docs/index.html, push branch

inputs:
  suite:
    description: "Suite identifier (a2a, a2a-slimrpc, slim-integration, slim-mcp, slim-benchmarks, slim-agent-consensus, slim-multicluster-private, directory-conformance, agentic-evidence)"
    required: true
  source-run-id:
    description: "Workflow run ID containing uploaded artifacts"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: site
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.4"
        cache-dependency-path: |
          integrations/go.sum
          benchmarks/go.sum

    - name: Download suite artifacts
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        RUN_ID: ${{ inputs.source-run-id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        chmod +x .github/scripts/download-workflow-artifact.sh
        case "$SUITE" in
          a2a)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --pattern 'a2a-interop-test-result-*'
            ;;
          a2a-slimrpc)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --pattern 'a2a-slimrpc-test-result-*'
            ;;
          slim-integration)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --name slim-integration-test-result
            ;;
          slim-mcp)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --name slim-mcp-test-result
            ;;
          slim-benchmarks)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging/smoke \
              --name slim-benchmark-smoke-report
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging/capacity \
              --name slim-benchmark-capacity-report
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging/basic \
              --name slim-benchmark-basic-report
            ;;
          slim-agent-consensus)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --name slim-agent-consensus-report
            ;;
          slim-multicluster-private)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --name slim-multicluster-private-test-result
            ;;
          directory-conformance)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --name directory-conformance-test-result
            ;;
          agentic-evidence)
            ./.github/scripts/download-workflow-artifact.sh "$RUN_ID" .pages-staging \
              --name agentic-evidence-dashboard
            ;;
          *)
            echo "unknown suite: $SUITE" >&2
            exit 1
            ;;
        esac

    - name: Build pages section
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        STAGING_DIR: ${{ github.workspace }}/.pages-staging
        SITE_DIR: ${{ github.workspace }}/site/docs
        REPO_ROOT: ${{ github.workspace }}
      run: |
        set -euo pipefail
        chmod +x .github/scripts/build-pages-section.sh integrations/agntcy-slim/topology/scripts/render-report.sh
        ./.github/scripts/build-pages-section.sh

    - name: Build site landing page
      shell: bash
      env:
        OUTPUT: site/docs/index.html
      run: |
        set -euo pipefail
        chmod +x .github/scripts/build-site-landing-page.sh
        ./.github/scripts/build-site-landing-page.sh

    - name: Commit and push gh-pages
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
      working-directory: site
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "No gh-pages changes to publish"
          exit 0
        fi
        git commit -m "Update ${SUITE} test reports from run ${SOURCE_RUN_ID}"
        git push origin HEAD:gh-pages
