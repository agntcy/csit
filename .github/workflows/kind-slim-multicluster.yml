#
# KinD multicluster (csit.peer) + optional ingress stack via Task:
# task up:with-ingress-apps / task down:with-ingress-apps (kind-slim-multi-host).
name: kind-slim-multicluster

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kind-slim-multi-host/**"
      - ".github/workflows/kind-slim-multicluster.yml"
      - ".github/actions/setup-k8s/**"
  push:
    branches:
      - main
    paths:
      - "kind-slim-multi-host/**"
      - ".github/workflows/kind-slim-multicluster.yml"
      - ".github/actions/setup-k8s/**"

permissions:
  contents: read
  packages: read

defaults:
  run:
    working-directory: kind-slim-multi-host

jobs:
  multicluster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kubernetes tooling
        uses: ./.github/actions/setup-k8s
        with:
          kind-version: "0.24.0"
          helm-version: "3.14.4"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.41.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Task prereq
        run: task prereq

      # Ubuntu runners may not ship `dig` (bind-dnsutils); host DNS checks need it.
      - name: Install dnsutils
        run: sudo apt-get update && sudo apt-get install -y dnsutils

      - name: Task up (full ingress + apps)
        run: task up:with-ingress-apps

      - name: Verify clusters
        run: |
          set -euo pipefail
          kubectl --context kind-csit-a get nodes
          kubectl --context kind-csit-b get nodes
          kubectl --context kind-csit-a -n ingress-nginx get pods
          kubectl --context kind-csit-b -n ingress-nginx get pods

      - name: Verify CoreDNS csit.peer stub (both clusters)
        run: |
          set -euo pipefail
          kubectl --context kind-csit-a get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}' | grep -q "BEGIN csit-peer"
          kubectl --context kind-csit-b get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}' | grep -q "BEGIN csit-peer"

      - name: Verify host DNS helper
        run: |
          set -euo pipefail
          dig @127.0.0.1 -p 8053 +short control.cluster-a.csit.test | grep -q '^127\.0\.0\.1$'
          dig +tcp @127.0.0.1 -p 8053 +short slim.cluster-b.csit.test | grep -q '^127\.0\.0\.1$'

      - name: Verify DNS resolution (cluster A)
        run: |
          set -euo pipefail
          kubectl --context kind-csit-a run dns-verify \
            -n default \
            --rm \
            --attach \
            --restart=Never \
            --image=docker.io/library/busybox:1.36 \
            --command -- \
            nslookup node-b.csit.peer

      - name: Verify Helm releases (optional apps)
        run: |
          set -euo pipefail
          helm list --kube-context kind-csit-a --namespace admin | grep -q slim-control
          helm list --kube-context kind-csit-a --namespace cluster-a | grep -q agntcy-cluster-a
          helm list --kube-context kind-csit-b --namespace cluster-b | grep -q agntcy-cluster-b

      - name: Teardown full stack
        if: always()
        run: task down:with-ingress-apps || true
