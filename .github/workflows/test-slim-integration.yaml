name: test-slim-integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      kind_version:
        description: "Kind version"
        required: false
        default: "0.24.0"
      override_slim_image_tag:
        description: "Override Slim image tag"
        required: false
        default: ""
      override_slim_chart_tag:
        description: "Override Slim chart tag"
        required: false
        default: ""
      override_slim_controller_image_tag:
        description: "Override Slim controller image tag (falls back to override_slim_image_tag when empty)"
        required: false
        default: ""
      override_slim_controller_chart_tag:
        description: "Override Slim controller chart tag (falls back to override_slim_chart_tag when empty)"
        required: false
        default: ""
      override_slim_bindings_version:
        description: "Override slim-bindings examples version"
        required: false
        default: ""

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.detect-suite.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect-suite
        uses: ./.github/actions/detect-suite-changes
        with:
          suite: slim-integration

  set-kind-version:
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      kind-version: ${{ steps.set-kind-version.outputs.kind-version }}
    steps:
      - name: Set KinD version
        id: set-kind-version
        env:
          KIND_VERSION: "0.24.0"
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == 'workflow_dispatch' ]; then
              KIND_VERSION="${{ inputs.kind_version }}"
          fi

          echo "Set KinD version to: $KIND_VERSION"
          echo "kind-version=$KIND_VERSION" >> "$GITHUB_OUTPUT"

  run-tests-slim-integration:
    needs: [detect, set-kind-version]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: read
      attestations: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python: true
          go: true
          go-version: "1.25.0"

      - name: Setup K8S Tools
        uses: ./.github/actions/setup-k8s
        with:
          kind-version: ${{ needs.set-kind-version.outputs.kind-version }}

      - name: Create kind cluster
        shell: bash
        run: task integrations:kind:create KIND_CLUSTER_NAME=agntcy-test

      - name: Setup slim topology
        shell: bash
        run: |
          task integrations:slim:test:topology:setup \
            TOPOLOGY_SLIM_IMAGE_TAG='${{ inputs.override_slim_image_tag }}' \
            TOPOLOGY_SLIM_CHART_TAG='${{ inputs.override_slim_chart_tag }}' \
            TOPOLOGY_SLIM_CONTROLLER_IMAGE_TAG='${{ inputs.override_slim_controller_image_tag != '' && inputs.override_slim_controller_image_tag || inputs.override_slim_image_tag }}' \
            TOPOLOGY_SLIM_CONTROLLER_CHART_TAG='${{ inputs.override_slim_controller_chart_tag != '' && inputs.override_slim_controller_chart_tag || inputs.override_slim_chart_tag }}' \
            SLIM_BINDINGS_VERSION='${{ inputs.override_slim_bindings_version }}' \
            KIND_CLUSTER_NAME=agntcy-test

      - name: Dump cluster diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "==================== all pods ===================="
          kubectl get pods -A -o wide
          echo "==================== recent events ===================="
          kubectl get events -A --sort-by=.lastTimestamp | tail -80
          for ns in admin cluster-a cluster-b cluster-c; do
            echo "==================== namespace: ${ns} ===================="
            kubectl -n "${ns}" get pods,svc,statefulset,deploy -o wide
            kubectl -n "${ns}" describe pods
            for p in $(kubectl -n "${ns}" get pods -o name 2>/dev/null); do
              echo "----- logs ${ns}/${p} (current) -----"
              kubectl -n "${ns}" logs "${p}" --all-containers --tail=200
              echo "----- logs ${ns}/${p} (previous) -----"
              kubectl -n "${ns}" logs "${p}" --all-containers --previous --tail=200
            done
          done
          echo "==================== control-plane port-forward log ===================="
          cat integrations/agntcy-slim/topology/.cache/port-forward.log 2>/dev/null || echo "no port-forward log"

      - name: Run slim topology test
        run: task integrations:slim:test:topology:run
        shell: bash

      - name: Render topology test report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          reports_dir="${GITHUB_WORKSPACE}/integrations/agntcy-slim/topology/reports"
          if [[ -f "${reports_dir}/report-slim-topology.json" ]]; then
            task integrations:slim:test:topology:report
            test -f "${reports_dir}/index.html"
            echo "### Topology report artifacts" >> "$GITHUB_STEP_SUMMARY"
            ls -la "${reports_dir}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No topology JSON report to render (checked ${reports_dir}/report-slim-topology.json)" >> "$GITHUB_STEP_SUMMARY"
            find "${GITHUB_WORKSPACE}" -name 'report-slim-topology.json' 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Create artifact from integrations test reports
        if: always()
        uses: ./.github/actions/create-artifact
        with:
          artifact-name: slim-integration-test-result
          path-to-archive: integrations/agntcy-slim/topology/reports/

  publish-pages:
    needs: [run-tests-slim-integration]
    if: always() && github.ref == 'refs/heads/main' && needs.run-tests-slim-integration.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: test-report-pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/publish-test-reports-pages
        with:
          suite: slim-integration
          source-run-id: ${{ github.run_id }}
