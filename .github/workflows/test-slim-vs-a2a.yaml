name: test-slim-vs-a2a

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-slim-vs-a2a.yaml'
      - 'benchmarks/slim-vs-a2a/**'
      - 'benchmarks/Taskfile.yml'
  pull_request:
    paths:
      - '.github/workflows/test-slim-vs-a2a.yaml'
      - 'benchmarks/slim-vs-a2a/**'
      - 'benchmarks/Taskfile.yml'
  workflow_dispatch:

jobs:
  slim-vs-a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          go: true

      - name: Run SLIM vs A2A comparison suite
        shell: bash
        working-directory: benchmarks/slim-vs-a2a
        run: |
          set -o pipefail
          task compare:suite

      - name: Build comparison report
        if: always()
        shell: bash
        working-directory: benchmarks/slim-vs-a2a
        run: task compare:report

      - name: Publish step summary
        if: always()
        shell: bash
        run: |
          REPORT_DIR="benchmarks/slim-vs-a2a/reports"
          {
            echo "# SLIM vs A2A — Consensus Comparison"
            echo
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- SHA: ${GITHUB_SHA}"
            echo
            if [ -f "$REPORT_DIR/results.tsv" ]; then
              echo "## results.tsv"
              echo
              echo '```'
              cat "$REPORT_DIR/results.tsv"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-vs-a2a-report
          path: benchmarks/slim-vs-a2a/reports/
          retention-days: 30
          if-no-files-found: warn

  publish-pages:
    needs: [slim-vs-a2a]
    if: always() && github.ref == 'refs/heads/main' && needs.slim-vs-a2a.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: test-report-pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/publish-test-reports-pages
        with:
          suite: slim-vs-a2a
          source-run-id: ${{ github.run_id }}
          source-run-conclusion: ${{ needs.slim-vs-a2a.result }}
